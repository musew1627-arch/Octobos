<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Délices de Soukaina — Recettes marocaines</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cream: #FFF9F1;
    --sand: #F8EDDD;
    --honey: #D9A441;
    --terra: #C67B5C;
    --brown: #3E2F26;
    --muted: #8A7568;
  }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--cream);
    color: var(--brown);
    line-height: 1.7;
  }
  header {
    text-align: center;
    padding: 4rem 1.5rem 3rem;
    background: linear-gradient(160deg, #FFF6E8 0%, #FBEEDF 50%, #F5DDBE 100%);
  }
  header .emoji { font-size: 3.2rem; margin-bottom: 0.6rem; }
  header h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; }
  header h1 .accent { color: var(--terra); }
  header p { color: var(--muted); max-width: 560px; margin: 0.6rem auto 0; }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(255, 249, 241, 0.96);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid #EFE0CC;
    padding: 0.9rem 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
    align-items: center;
  }
  .toolbar input {
    padding: 0.6rem 1rem;
    border-radius: 99px;
    border: 1.5px solid #E5D3B8;
    background: #fff;
    font-size: 0.95rem;
    width: min(280px, 80vw);
    outline: none;
  }
  .toolbar input:focus { border-color: var(--honey); }
  .pill {
    padding: 0.55rem 1.1rem;
    border-radius: 99px;
    border: 1.5px solid #E5D3B8;
    background: #fff;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  .pill:hover { border-color: var(--honey); }
  .pill.active {
    background: var(--terra);
    border-color: var(--terra);
    color: #fff;
    font-weight: 600;
  }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 2.2rem 1.2rem 4rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 1.4rem;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(198, 123, 92, 0.12);
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 12px 32px rgba(198, 123, 92, 0.2); }
  .card .img {
    font-size: 3.4rem;
    text-align: center;
    padding: 1.8rem 1rem 1.2rem;
    background: linear-gradient(140deg, #FDF3E3, #F7E3C2);
  }
  .card .body { padding: 1.1rem 1.3rem 1.4rem; }
  .card h3 { font-size: 1.15rem; margin-bottom: 0.5rem; }
  .meta { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .badge {
    font-size: 0.78rem;
    padding: 0.2rem 0.7rem;
    border-radius: 99px;
    background: var(--sand);
    color: var(--muted);
  }
  .badge.facile { background: #E4F3E0; color: #3E7A3A; }
  .badge.moyen { background: #FBEFD4; color: #A07514; }
  .badge.difficile { background: #F9E2DC; color: #B04A32; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
    font-size: 1.1rem;
    display: none;
  }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(62, 47, 38, 0.55);
    display: none;
    justify-content: center;
    align-items: flex-start;
    overflow-y: auto;
    padding: 2rem 1rem;
    z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--cream);
    border-radius: 20px;
    max-width: 640px;
    width: 100%;
    overflow: hidden;
    animation: pop 0.25s ease;
  }
  @keyframes pop { from { transform: scale(0.96); opacity: 0; } }
  .modal .img {
    font-size: 4rem;
    text-align: center;
    padding: 2rem 1rem 1.4rem;
    background: linear-gradient(140deg, #FDF3E3, #F5D3A8);
  }
  .modal .content { padding: 1.6rem 1.8rem 2rem; }
  .modal h2 { font-size: 1.6rem; margin-bottom: 0.4rem; }
  .modal .meta { margin-bottom: 1.2rem; }
  .modal h4 {
    margin: 1.3rem 0 0.6rem;
    color: var(--terra);
    font-size: 1.05rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .modal ul, .modal ol { padding-left: 1.3rem; }
  .modal li { margin-bottom: 0.45rem; color: #5A4A3E; }
  .modal ol li { margin-bottom: 0.7rem; }
  .close-btn {
    display: block;
    margin: 1.6rem auto 0;
    padding: 0.7rem 2.4rem;
    border-radius: 99px;
    border: none;
    background: var(--terra);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 600;
  }
  .close-btn:hover { background: #A85F42; }
  footer {
    text-align: center;
    padding: 2.2rem 1rem;
    background: var(--brown);
    color: #EDE0D2;
    font-size: 0.92rem;
  }
</style>
</head>
<body>

<header>
  <div class="emoji">🍰</div>
  <h1>Les Délices de <span class="accent">Soukaina</span></h1>
  <p>Recettes marocaines authentiques, expliquées pas à pas — du tajine fumant aux douceurs au miel.</p>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="🔍 Rechercher une recette...">
  <button class="pill active" data-cat="all">Tout</button>
  <button class="pill" data-cat="sale">Salé 🍲</button>
  <button class="pill" data-cat="sucre">Sucré 🍯</button>
  <button class="pill" data-cat="gouter">Goûter 🫓</button>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Aucune recette trouvée 😕</div>
</main>

<div class="modal-backdrop" id="backdrop">
  <div class="modal">
    <div class="img" id="m-img"></div>
    <div class="content">
      <h2 id="m-title"></h2>
      <div class="meta" id="m-meta"></div>
      <h4>Ingrédients</h4>
      <ul id="m-ingredients"></ul>
      <h4>Préparation</h4>
      <ol id="m-steps"></ol>
      <button class="close-btn" onclick="closeModal()">Fermer</button>
    </div>
  </div>
</div>

<footer>Made with ♥ par Soukaina — 2026</footer>

<script>
const recipes = [
  {
    name: "Chebakia", emoji: "🍯", cat: "sucre", catLabel: "Sucré",
    time: "1h + friture", level: "Difficile", levelClass: "difficile",
    ingredients: [
      "500 g de farine", "125 g de graines de sésame grillées et moulues",
      "1 c. à café de cannelle", "1/2 c. à café de gomme arabique (meska)",
      "1 pincée de sel", "125 g de beurre fondu", "1 œuf",
      "1 c. à soupe de vinaigre", "10 cl d'eau de fleur d'oranger",
      "500 g de miel", "Graines de sésame pour décorer", "Huile pour friture"
    ],
    steps: [
      "Mélangez la farine, le sésame moulu, la cannelle, la gomme arabique et le sel.",
      "Ajoutez le beurre fondu, l'œuf et le vinaigre, puis ramassez la pâte avec l'eau de fleur d'oranger.",
      "Laissez reposer 30 minutes sous un torchon.",
      "Étalez finement, découpez des bandes et formez des fleurs.",
      "Faites frire dans l'huile chaude jusqu'à belle couleur dorée.",
      "Plongez immédiatement dans le miel chaud, égouttez et parsemez de sésame."
    ]
  },
  {
    name: "Kaab el Ghazal", emoji: "🌙", cat: "sucre", catLabel: "Sucré",
    time: "1h", level: "Moyen", levelClass: "moyen",
    ingredients: [
      "Pâte : 250 g de farine, 125 g de beurre fondu, 1 pincée de sel, eau de fleur d'oranger",
      "Farce : 250 g d'amandes moulues, 125 g de sucre",
      "1 c. à café de cannelle", "2 c. à soupe de beurre fondu",
      "Eau de fleur d'oranger pour ramasser"
    ],
    steps: [
      "Préparez la pâte, filmez et laissez reposer 30 minutes.",
      "Mélangez les ingrédients de la farce jusqu'à obtenir une pâte homogène.",
      "Étalez la pâte très finement et découpez des ronds.",
      "Déposez un boudin de farce et roulez en forme de croissant.",
      "Enfournez à 160°C pendant 15 à 20 minutes — les gâteaux doivent rester pâles."
    ]
  },
  {
    name: "Couscous aux légumes", emoji: "🥘", cat: "sale", catLabel: "Salé",
    time: "1h30", level: "Moyen", levelClass: "moyen",
    ingredients: [
      "500 g de couscous fin", "500 g de viande (bœuf ou agneau)",
      "2 oignons", "3 carottes", "2 courgettes", "1 navet", "2 tomates",
      "100 g de pois chiches trempés", "1 c. à soupe de concentré de tomate",
      "Gingembre, curcuma, poivre, sel, coriandre",
      "Huile d'olive et une noix de beurre (ou smen)"
    ],
    steps: [
      "Faites revenir la viande avec les oignons émincés, les épices et l'huile d'olive.",
      "Ajoutez les tomates, le concentré et couvrez d'eau. Laissez cuire 30 minutes.",
      "Ajoutez les carottes, le navet et les pois chiches, puis 20 minutes après les courgettes.",
      "Faites cuire le couscous à la vapeur 3 fois en l'aérant entre chaque passage.",
      "Servez le couscous arrosé de bouillon, avec la viande et les légumes dessus."
    ]
  },
  {
    name: "Tajine kefta aux œufs", emoji: "🍳", cat: "sale", catLabel: "Salé",
    time: "40 min", level: "Facile", levelClass: "facile",
    ingredients: [
      "500 g de viande hachée", "1 oignon râpé",
      "Persil et coriandre hachés", "1 c. à café de cumin",
      "1 c. à café de paprika", "Sel, poivre",
      "3 tomates râpées", "2 œufs", "Huile d'olive"
    ],
    steps: [
      "Mélangez la viande hachée avec l'oignon, les herbes et les épices. Formez des boulettes.",
      "Faites mijoter les tomates râpées avec un filet d'huile d'olive 15 minutes dans le tajine.",
      "Ajoutez les boulettes de kefta et laissez cuire 15 minutes à couvert.",
      "Cassez les œufs sur le dessus et laissez prendre 5 minutes. Servez chaud avec du pain."
    ]
  },
  {
    name: "Pastilla au poulet", emoji: "🥧", cat: "sale", catLabel: "Salé",
    time: "1h30", level: "Difficile", levelClass: "difficile",
    ingredients: [
      "1 poulet (~1,2 kg)", "500 g d'oignons émincés", "8 œufs",
      "250 g d'amandes", "10 feuilles de brick",
      "Persil et coriandre", "Gingembre, cannelle, curcuma",
      "Sucre glace", "Beurre"
    ],
    steps: [
      "Faites cuire le poulet avec les oignons, les épices et les herbes jusqu'à ce qu'il soit tendre.",
      "Effilochez le poulet, puis faites réduire la sauce.",
      "Battez les œufs et brouillez-les dans la sauce réduite.",
      "Faites frire les amandes, concassez-les et mélangez avec sucre et cannelle.",
      "Montez la pastilla en couches dans un plat rond beurré : feuilles, poulet, œufs, amandes.",
      "Enfournez à 180°C pendant 30 minutes. Saupoudrez de sucre glace et cannelle avant de servir."
    ]
  },
  {
    name: "Harira", emoji: "🍲", cat: "sale", catLabel: "Salé",
    time: "1h", level: "Facile", levelClass: "facile",
    ingredients: [
      "200 g de pois chiches trempés la veille", "100 g de lentilles",
      "500 g de tomates mixées", "1 oignon haché",
      "Céleri, persil et coriandre", "100 g de viande en petits dés (optionnel)",
      "Gingembre, curcuma, poivre, sel",
      "2 c. à soupe de concentré de tomate",
      "Tedouira : farine délayée dans de l'eau", "1 c. à soupe de smen"
    ],
    steps: [
      "Mettez tous les ingrédients (sauf la tedouira) dans une grande marmite avec 2 litres d'eau.",
      "Laissez cuire 45 minutes à feu moyen.",
      "Préparez la tedouira en délayant 3 c. à soupe de farine dans un verre d'eau.",
      "Versez la tedouira en remuant sans arrêt jusqu'à épaississement (10 minutes).",
      "Ajoutez le smen, rectifiez l'assaisonnement et servez bien chaude."
    ]
  },
  {
    name: "Baghrir", emoji: "🥞", cat: "gouter", catLabel: "Goûter",
    time: "40 min", level: "Facile", levelClass: "facile",
    ingredients: [
      "250 g de semoule fine", "60 g de farine",
      "1 c. à café de sucre", "1 c. à café de sel",
      "1 sachet de levure chimique", "1 c. à soupe de levure boulangère",
      "500 ml d'eau tiède", "Miel et beurre pour servir"
    ],
    steps: [
      "Mixez tous les ingrédients jusqu'à obtenir une pâte fluide et homogène.",
      "Laissez reposer 30 minutes — la pâte doit mousser légèrement.",
      "Versez une louche dans une poêle antiadhésive chaude, sans retourner : des trous se forment.",
      "Servez chaud avec du miel fondu mélangé au beurre."
    ]
  },
  {
    name: "Msemen", emoji: "🫓", cat: "gouter", catLabel: "Goûter",
    time: "1h", level: "Moyen", levelClass: "moyen",
    ingredients: [
      "500 g de farine (ou moitié farine, moitié semoule fine)",
      "1 c. à café de sel", "1 c. à café de sucre",
      "~300 ml d'eau tiède", "Huile et beurre fondu pour le façonnage"
    ],
    steps: [
      "Pétrissez la farine, le sel, le sucre et l'eau pendant 10 minutes jusqu'à une pâte souple.",
      "Laissez reposer 15 minutes, puis divisez en boules de la taille d'une mandarine.",
      "Aplatissez chaque boule avec les mains huilées en une feuille très fine.",
      "Pliez en portefeuille (enveloppe) en badigeonnant de beurre fondu.",
      "Faites cuire des deux côtés dans une poêle chaude jusqu'à belle couleur dorée."
    ]
  }
];

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const searchInput = document.getElementById('search');
let activeCat = 'all';

function render() {
  const q = searchInput.value.toLowerCase().trim();
  grid.innerHTML = '';
  let count = 0;
  recipes.forEach((r, i) => {
    const matchCat = activeCat === 'all' || r.cat === activeCat;
    const matchQ = !q || r.name.toLowerCase().includes(q);
    if (!matchCat || !matchQ) return;
    count++;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="img">' + r.emoji + '</div>' +
      '<div class="body"><h3>' + r.name + '</h3>' +
      '<div class="meta"><span class="badge">⏱ ' + r.time + '</span>' +
      '<span class="badge ' + r.levelClass + '">' + r.level + '</span>' +
      '<span class="badge">' + r.catLabel + '</span></div></div>';
    card.onclick = (function(idx){ return function(){ openModal(idx); }; })(i);
    grid.appendChild(card);
  });
  empty.style.display = count === 0 ? 'block' : 'none';
}

function openModal(i) {
  const r = recipes[i];
  document.getElementById('m-img').textContent = r.emoji;
  document.getElementById('m-title').textContent = r.name;
  document.getElementById('m-meta').innerHTML =
    '<span class="badge">⏱ ' + r.time + '</span>' +
    '<span class="badge ' + r.levelClass + '">' + r.level + '</span>' +
    '<span class="badge">' + r.catLabel + '</span>';
  document.getElementById('m-ingredients').innerHTML =
    r.ingredients.map(function(x){ return '<li>' + x + '</li>'; }).join('');
  document.getElementById('m-steps').innerHTML =
    r.steps.map(function(x){ return '<li>' + x + '</li>'; }).join('');
  document.getElementById('backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('backdrop').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('backdrop').addEventListener('click', function(e) {
  if (e.target.id === 'backdrop') closeModal();
});

document.querySelectorAll('.pill').forEach(function(p) {
  p.onclick = function() {
    document.querySelectorAll('.pill').forEach(function(x){ x.classList.remove('active'); });
    p.classList.add('active');
    activeCat = p.dataset.cat;
    render();
  };
});

searchInput.addEventListener('input', render);
render();
</script>

</body>
</html>
