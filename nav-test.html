<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #2B2119;
    --cream: #FFFBF4;
    --sand: #F6ECDC;
    --gold: #C99A3C;
    --terra: #B4552D;
    --muted: #8A7568;
    --serif: Georgia, 'Times New Roman', serif;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.7;
  }
  /* ---------- NAV ---------- */
  nav {
    position: sticky; top: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.9rem 2rem;
    background: rgba(255, 251, 244, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #EBDCC4;
  }
  nav .logo { font-family: var(--serif); font-size: 1.3rem; font-weight: bold; }
  nav .logo span { color: var(--terra); }
  nav a.nav-link {
    text-decoration: none; color: var(--ink); font-weight: 600;
    font-size: 0.95rem; margin-left: 1.4rem; white-space: nowrap;
  }
  nav a.nav-link:hover { color: var(--terra); }
  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    min-height: 62vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    background-color: #3A2A1E; background-size: cover; background-position: center; background-repeat: no-repeat;
    color: #fff;
  }
  .hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,12,6,0.55) 0%, rgba(20,12,6,0.35) 45%, rgba(20,12,6,0.72) 100%);
  }
  .hero-inner { position: relative; z-index: 1; padding: 4rem 1.5rem; max-width: 760px; }
  .hero .kicker {
    letter-spacing: 4px; text-transform: uppercase; font-size: 0.8rem;
    color: var(--gold); font-weight: 700; margin-bottom: 1rem;
  }
  .hero h1 {
    font-family: var(--serif);
    font-size: clamp(2.4rem, 7vw, 4.2rem);
    line-height: 1.15; margin-bottom: 1rem;
    text-shadow: 0 2px 18px rgba(0,0,0,0.4);
  }
  .hero p { font-size: 1.1rem; opacity: 0.92; margin-bottom: 2rem; }
  .btn {
    display: inline-block;
    background: var(--terra); color: #fff;
    padding: 0.85rem 2.4rem; border-radius: 99px;
    text-decoration: none; font-weight: 700; font-size: 1rem;
    transition: transform 0.2s, background 0.2s;
    box-shadow: 0 8px 24px rgba(180, 85, 45, 0.4);
  }
  .btn:hover { background: #96431F; transform: translateY(-2px); }
  /* ---------- TOOLBAR ---------- */
  .toolbar {
    position: sticky; top: 60px; z-index: 15;
    background: rgba(255, 251, 244, 0.96);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid #EBDCC4;
    padding: 0.9rem 1rem;
    display: flex; flex-wrap: wrap; gap: 0.6rem;
    justify-content: center; align-items: center;
  }
  .toolbar input {
    padding: 0.6rem 1.1rem; border-radius: 99px;
    border: 1.5px solid #E2CFAE; background: #fff;
    font-size: 0.95rem; width: min(280px, 80vw); outline: none;
  }
  .toolbar input:focus { border-color: var(--gold); }
  .pill {
    padding: 0.55rem 1.15rem; border-radius: 99px;
    border: 1.5px solid #E2CFAE; background: #fff;
    cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
  }
  .pill:hover { border-color: var(--gold); }
  .pill.active {
    background: var(--ink); border-color: var(--ink);
    color: #fff; font-weight: 600;
  }
  /* ---------- GRID ---------- */
  main { max-width: 1140px; margin: 0 auto; padding: 3rem 1.4rem 4rem; }
  .section-head { text-align: center; margin-bottom: 2.2rem; }
  .section-head h2 { font-family: var(--serif); font-size: 2rem; margin-bottom: 0.3rem; }
  .section-head p { color: var(--muted); }
  .section-head .rule {
    width: 64px; height: 3px; background: var(--gold);
    margin: 0.9rem auto 0; border-radius: 2px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 1.6rem;
  }
  .card {
    background: #fff; border-radius: 16px; overflow: hidden;
    box-shadow: 0 8px 28px rgba(43, 33, 25, 0.08);
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-7px); box-shadow: 0 16px 40px rgba(43, 33, 25, 0.16); }
  .card .photo { position: relative; aspect-ratio: 4/3; overflow: hidden; }
  .card .photo img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.5s ease;
  }
  .card:hover .photo img { transform: scale(1.07); }
  .card .cat-tag {
    position: absolute; top: 12px; left: 12px;
    background: rgba(255,255,255,0.94); color: var(--ink);
    font-size: 0.75rem; font-weight: 700;
    padding: 0.28rem 0.8rem; border-radius: 99px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .card .body { padding: 1.2rem 1.35rem 1.4rem; flex: 1; display: flex; flex-direction: column; }
  .card h3 { font-family: var(--serif); font-size: 1.3rem; margin-bottom: 0.6rem; }
  .card .desc { color: var(--muted); font-size: 0.92rem; margin-bottom: 1rem; flex: 1; }
  .meta { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .badge {
    font-size: 0.76rem; padding: 0.24rem 0.7rem; border-radius: 99px;
    background: var(--sand); color: var(--muted); font-weight: 600;
  }
  .badge.facile { background: #E4F3E0; color: #3E7A3A; }
  .badge.moyen { background: #FBEFD4; color: #96700F; }
  .badge.difficile { background: #F9E2DC; color: #A8432B; }
  .card .cta { color: var(--terra); font-weight: 700; font-size: 0.95rem; }
  .card:hover .cta { text-decoration: underline; }
  .empty { text-align: center; color: var(--muted); padding: 3rem 1rem; font-size: 1.1rem; display: none; }
  /* ---------- ABOUT ---------- */
  .about {
    background: var(--ink); color: #EDE0D2;
    padding: 3.5rem 1.5rem; text-align: center; margin-top: 1rem;
  }
  .about h2 { font-family: var(--serif); font-size: 1.8rem; margin-bottom: 0.8rem; color: #fff; }
  .about h2 span { color: var(--gold); }
  .about p { max-width: 620px; margin: 0 auto; opacity: 0.88; }
  /* ---------- MODAL ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(30, 20, 12, 0.62);
    display: none; justify-content: center; align-items: flex-start;
    overflow-y: auto; padding: 2.2rem 1rem;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--cream); border-radius: 20px;
    max-width: 680px; width: 100%; overflow: hidden;
    animation: pop 0.28s ease;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);
  }
  @keyframes pop { from { transform: translateY(16px) scale(0.98); opacity: 0; } }
  .modal .photo { position: relative; height: 260px; overflow: hidden; }
  .modal .photo img { width: 100%; height: 100%; object-fit: cover; }
  .modal .photo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(20,12,6,0.55) 100%);
  }
  .modal .photo h2 {
    position: absolute; bottom: 1rem; left: 1.6rem; z-index: 1;
    font-family: var(--serif); color: #fff; font-size: 1.9rem;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .modal .content { padding: 1.6rem 1.9rem 2.1rem; }
  .modal .meta { margin-bottom: 0.4rem; }
  .modal h4 {
    margin: 1.5rem 0 0.7rem; color: var(--terra);
    font-size: 0.95rem; text-transform: uppercase; letter-spacing: 2px;
  }
  .modal ul.ingredients {
    padding-left: 0; list-style: none;
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 1.2rem;
  }
  .modal ul.ingredients li { color: #5A4A3E; font-size: 0.95rem; padding-left: 1.1rem; position: relative; }
  .modal ul.ingredients li::before {
    content: '•'; position: absolute; left: 0; color: var(--gold); font-weight: bold;
  }
  .modal ol { padding-left: 0; list-style: none; counter-reset: step; }
  .modal ol li {
    counter-increment: step; margin-bottom: 0.9rem; color: #4A3B30;
    padding-left: 2.6rem; position: relative;
  }
  .modal ol li::before {
    content: counter(step);
    position: absolute; left: 0; top: 0.1rem;
    width: 1.8rem; height: 1.8rem; border-radius: 50%;
    background: var(--sand); color: var(--terra);
    font-weight: 800; font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
  }
  .tip {
    margin-top: 1.4rem; padding: 1rem 1.2rem;
    background: #FDF6E7; border-left: 4px solid var(--gold);
    border-radius: 0 12px 12px 0; font-size: 0.94rem; color: #6B543A;
  }
  .tip strong { color: var(--terra); }
  .close-btn {
    display: block; margin: 1.8rem auto 0;
    padding: 0.75rem 2.6rem; border-radius: 99px; border: none;
    background: var(--ink); color: #fff;
    font-size: 1rem; cursor: pointer; font-weight: 700;
  }
  .close-btn:hover { background: var(--terra); }
  footer {
    text-align: center; padding: 2rem 1rem;
    background: #1E150E; color: #A89880; font-size: 0.88rem;
  }
  @media (max-width: 560px) {
    .modal ul.ingredients { grid-template-columns: 1fr; }
    nav { padding: 0.8rem 1.1rem; }
    nav .logo { font-size: 0.95rem; white-space: nowrap; }
    nav .nav-links { display: flex; gap: 0.7rem; }
    nav a.nav-link { font-size: 0.8rem; margin-left: 0; }
  }
</style></head>
<body style="margin:0"><nav>
  <div class="logo">🍰 Les Délices de <span>Soukaina</span></div>
  <div class="nav-links">
    <a class="nav-link" href="#recettes">Recettes</a>
    <a class="nav-link" href="#apropos">À propos</a>
  </div>
</nav>
<div style="height:1200px;background:#FFF8F0"></div>
</body></html>
